<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        #reader { width: 100%; max-width: 400px; margin: auto; background: white; padding: 10px; border-radius: 8px; }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <h2>สแกนบาร์โค้ดสินค้า</h2>
    <div id="reader"></div>
    <div id="result">ผลการสแกนจะแสดงที่นี่</div>

    <script>
        function onScanSuccess(decodedText) {
            document.getElementById('result').innerText = "รหัสบาร์โค้ด: " + decodedText;
        }
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
